syntax = "proto3";

package blueeconomy.contracts.v1;

import "blueeconomy/contracts/v1/common.proto";
import "blueeconomy/contracts/v1/isr.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/munisp/blueeconomy-contracts/gen/go/blueeconomy/contracts/v1;contractsv1";

// Phase 8: Yaounde Architecture regional information-exchange gateway
// (maritime.yaounde.v1 topic). Each message is a domain resource transported
// as the primary resource of an EventEnvelope FHIR message Bundle. The
// gateway exchanges incident reports, inbound regional advisories and
// shared-picture contributions with Yaounde Architecture peers (ICC,
// CRESMAC/CRESMAO, MMCC zones, MDAT-GoG-style contacts). No YARIS or peer
// wire-protocol compatibility is claimed or implied by these contracts; raw
// classified tracks, evidence payloads and peer secrets stay inside the
// gateway boundary and events carry tokenized references and digests only.
// See docs/yaounde-gateway-events.md.

// YaoundePeerKind is the fail-closed taxonomy of regional exchange peers a
// gateway deployment may be configured with. Free-text peer kinds are
// prohibited. The canonical JSON wire form renders these values without the
// YAOUNDE_PEER_KIND_ prefix (for example YAOUNDE_PEER_KIND_MMCC renders as
// "MMCC"); consumers must fail closed on any other value.
enum YaoundePeerKind {
  YAOUNDE_PEER_KIND_UNSPECIFIED = 0;
  // Interregional Coordination Centre (ICC), Yaounde.
  YAOUNDE_PEER_KIND_ICC = 1;
  // Regional coordination centre for Central Africa.
  YAOUNDE_PEER_KIND_CRESMAC = 2;
  // Regional coordination centre for West Africa.
  YAOUNDE_PEER_KIND_CRESMAO = 3;
  // Multinational Maritime Coordination Centre (zonal, for example Zone E).
  YAOUNDE_PEER_KIND_MMCC = 4;
  // National Maritime Operational Centre of a partner state.
  YAOUNDE_PEER_KIND_MOC = 5;
  // MDAT-GoG-style reporting contact (phone/email/manual fallback channel).
  YAOUNDE_PEER_KIND_MDAT_GOG = 6;
  // IMB Piracy Reporting Centre.
  YAOUNDE_PEER_KIND_IMB_PRC = 7;
  // Other vetted peer recorded with full provenance.
  YAOUNDE_PEER_KIND_OTHER = 8;
}

// YaoundeZone is the fail-closed Yaounde Architecture zone scoping of a peer
// or a shared-picture contribution. The canonical JSON wire form renders
// these values without the YAOUNDE_ZONE_ prefix (for example
// YAOUNDE_ZONE_ZONE_E renders as "ZONE_E").
enum YaoundeZone {
  YAOUNDE_ZONE_UNSPECIFIED = 0;
  YAOUNDE_ZONE_ZONE_D = 1;
  YAOUNDE_ZONE_ZONE_E = 2;
  YAOUNDE_ZONE_ZONE_F = 3;
  YAOUNDE_ZONE_ZONE_G = 4;
  // Central-African second zone of the architecture.
  YAOUNDE_ZONE_CENTRAL_B = 5;
  // Interregional scope (ICC).
  YAOUNDE_ZONE_INTERREGIONAL = 6;
  // Global contact outside the zonal hierarchy (for example MDAT-GoG).
  YAOUNDE_ZONE_GLOBAL = 7;
}

// ReleaseMarking is the fail-closed release/handling marking (distribution
// caveat) carried by every exchanged message alongside the national clearance
// label. Release rules never widen visibility: RELEASE_MARKING_NATIONAL_ONLY
// is never releasable and the gateway must refuse it fail closed. The
// canonical JSON wire form renders these values without the RELEASE_MARKING_
// prefix (for example RELEASE_MARKING_YAOUNDE_ZONE_E renders as
// "YAOUNDE_ZONE_E"); consumers must fail closed on any other value.
enum ReleaseMarking {
  RELEASE_MARKING_UNSPECIFIED = 0;
  // National use only; never releasable to any peer. Asserting this marking
  // on an outbound release is a policy refusal, not a dispatch.
  RELEASE_MARKING_NATIONAL_ONLY = 1;
  // Releasable to the Yaounde Zone E community (MMCC Zone E and national
  // MOCs of the zone).
  RELEASE_MARKING_YAOUNDE_ZONE_E = 2;
  // Releasable regionally across the Yaounde Architecture (ICC, CRESMAC,
  // CRESMAO, all MMCC zones).
  RELEASE_MARKING_YAOUNDE_REGIONAL = 3;
  // Releasable to MDAT-GoG-style reporting contacts.
  RELEASE_MARKING_MDAT_GOG_SHAREABLE = 4;
}

// YaoundeReleaseState is the fail-closed lifecycle state of an outbound
// release. Legal transitions: DRAFT -> APPROVED -> DISPATCHED ->
// ACKNOWLEDGED; FAILED is retryable-explicit from DISPATCHED; WITHDRAWN is
// terminal from DRAFT or APPROVED. Consumers must fail closed on UNSPECIFIED.
enum YaoundeReleaseState {
  YAOUNDE_RELEASE_STATE_UNSPECIFIED = 0;
  YAOUNDE_RELEASE_STATE_DRAFT = 1;
  // Approved by a distinct principal (maker-checker); the envelope v1.0 JWS
  // of the report is sealed at this transition.
  YAOUNDE_RELEASE_STATE_APPROVED = 2;
  YAOUNDE_RELEASE_STATE_DISPATCHED = 3;
  // Acknowledged only on a verifiable peer-signed receipt; never asserted
  // without one.
  YAOUNDE_RELEASE_STATE_ACKNOWLEDGED = 4;
  // Delivery failed; retry is an explicit operator action.
  YAOUNDE_RELEASE_STATE_FAILED = 5;
  // Withdrawn before dispatch; terminal.
  YAOUNDE_RELEASE_STATE_WITHDRAWN = 6;
}

// InboundAdjudicationState is the fail-closed adjudication state of an
// inbound regional report. Inbound items never overwrite national records;
// they remain PENDING until an analyst correlates or rejects them.
enum InboundAdjudicationState {
  INBOUND_ADJUDICATION_STATE_UNSPECIFIED = 0;
  INBOUND_ADJUDICATION_STATE_PENDING = 1;
  // Correlated to a maritime incident record by an analyst.
  INBOUND_ADJUDICATION_STATE_CORRELATED = 2;
  INBOUND_ADJUDICATION_STATE_REJECTED = 3;
}

// PictureContributionState is the fail-closed lifecycle state of a shared
// maritime picture contribution: PREPARED -> APPROVED -> DISPATCHED ->
// ACKNOWLEDGED; FAILED is retryable-explicit. The classification ceiling is
// re-applied at dispatch time, not only at preparation.
enum PictureContributionState {
  PICTURE_CONTRIBUTION_STATE_UNSPECIFIED = 0;
  PICTURE_CONTRIBUTION_STATE_PREPARED = 1;
  PICTURE_CONTRIBUTION_STATE_APPROVED = 2;
  PICTURE_CONTRIBUTION_STATE_DISPATCHED = 3;
  PICTURE_CONTRIBUTION_STATE_ACKNOWLEDGED = 4;
  PICTURE_CONTRIBUTION_STATE_FAILED = 5;
}

// RegionalIncidentReport is the incident-report resource sealed into an
// outbound envelope (event type maritime.yaounde.incident_report.v1) for a
// configured regional peer. The content is assembled strictly from
// adjudicated platform records at seal time: the incident reference,
// category, severity, position (only when releasable under the marking and
// classification ceiling), an operator-written attributed narrative, and
// digests of correlated tracks. Raw classified tracks above the ceiling and
// unreleaseable narrative content are never carried.
message RegionalIncidentReport {
  // Service-assigned immutable release identifier.
  string release_id = 1;
  // Reference to the adjudicated maritime incident record.
  string incident_reference = 2;
  // Tokenized peer reference resolvable inside the gateway boundary.
  string peer_reference = 3;
  ReleaseMarking marking = 4;
  // National clearance label of the released content; never widened by the
  // release. Mandatory: UNSPECIFIED is invalid on the wire.
  SecurityClassification classification = 5;
  // Stable machine-readable incident category code (for example "PIRACY").
  string incident_category_code = 6;
  Severity severity_level = 7;
  google.protobuf.Timestamp occurred_at = 8;
  // Release-cleared position in fixed-point micro-degrees (degrees scaled by
  // 1e6). Absent when no position is releasable under the marking and
  // ceiling. Fixed-point only; floating-point coordinates are prohibited.
  optional int32 latitude_micros = 9;
  optional int32 longitude_micros = 10;
  // Operator-written, release-cleared narrative. Attributed to its author
  // inside the gateway boundary; no classified content.
  string narrative = 11;
  // Digests ("sha256:<64 lowercase hex>") of correlated track evidence;
  // raw tracks are not carried.
  repeated string track_digest_sha256 = 12;
  // Digest of the canonical report payload, "sha256:<64 lowercase hex>".
  string report_digest_sha256 = 13;
}

// YaoundeReleaseTransitioned records a state transition of an outbound
// release (event type maritime.yaounde.release_transitioned.v1) on the
// maritime.yaounde.v1 topic. Replay-safe by release_id; consumers must fail
// closed when state is UNSPECIFIED. The peer acknowledgement carried at the
// ACKNOWLEDGED transition must be a verifiable peer-signed receipt digest;
// acknowledgements are never fabricated.
message YaoundeReleaseTransitioned {
  string release_id = 1;
  // Reference to the adjudicated maritime incident record.
  string incident_reference = 2;
  // Tokenized peer reference resolvable inside the gateway boundary.
  string peer_reference = 3;
  ReleaseMarking marking = 4;
  YaoundeReleaseState prior_state = 5;
  YaoundeReleaseState state = 6;
  // Stable machine-readable reason code; mandatory on FAILED, WITHDRAWN and
  // on policy refusals.
  string transition_reason_code = 7;
  // Digest of the sealed report envelope ("sha256:<64 lowercase hex>"); the
  // sealed artifact is retained inside the gateway boundary.
  string envelope_digest_sha256 = 8;
  // Digest of the peer-signed acknowledgement receipt. Present only at the
  // ACKNOWLEDGED transition; consumers must fail closed on an ACKNOWLEDGED
  // transition without it.
  string ack_receipt_digest_sha256 = 9;
  google.protobuf.Timestamp transitioned_at = 10;
}

// YaoundeInboundReportAdmitted records the admission of an inbound regional
// report (event type maritime.yaounde.inbound_report_admitted.v1) through the
// signed feed-admission path. The peer payload is Ed25519-verified against
// the registered peer key and retained verbatim inside the gateway boundary;
// the event carries only its digest. Admission is replay-safe on
// (peer_reference, peer_report_reference): identical replay returns the
// retained evidence; conflicting reuse fails closed.
message YaoundeInboundReportAdmitted {
  // Service-assigned immutable inbound report identifier.
  string report_id = 1;
  // Tokenized peer reference resolvable inside the gateway boundary.
  string peer_reference = 2;
  YaoundePeerKind peer_kind = 3;
  // Peer-assigned report reference; unique per peer.
  string peer_report_reference = 4;
  // Peer-asserted classification label of the inbound item.
  SecurityClassification classification = 5;
  // Peer-asserted handling marking. Unknown markings fail closed.
  ReleaseMarking marking = 6;
  // Digest of the retained verbatim payload ("sha256:<64 lowercase hex>");
  // the payload itself stays inside the gateway boundary.
  string payload_digest_sha256 = 7;
  // Digest of the peer Ed25519 signature over the payload; the raw signature
  // is retained inside the gateway boundary.
  string signature_digest_sha256 = 8;
  InboundAdjudicationState adjudication = 9;
  google.protobuf.Timestamp received_at = 10;
}

// YaoundePictureContributionTransitioned records a state transition of a
// shared maritime picture contribution (event type
// maritime.yaounde.picture_contribution_transitioned.v1). The contribution
// digest binds the exact filtered track set; the classification ceiling is
// re-applied at dispatch time so tracks that gained a higher classification
// between preparation and dispatch cannot leak.
message YaoundePictureContributionTransitioned {
  // Service-assigned immutable contribution identifier.
  string contribution_id = 1;
  // Tokenized peer reference resolvable inside the gateway boundary.
  string peer_reference = 2;
  // Yaounde zone scope actually applied.
  YaoundeZone zone = 3;
  PictureContributionState prior_state = 4;
  PictureContributionState state = 5;
  // Classification ceiling applied; nothing above it is included. Re-checked
  // at dispatch.
  SecurityClassification classification_ceiling = 6;
  // Number of tracks included after zone and ceiling filtering. Zero is a
  // truthful value, never padded.
  uint32 track_count = 7;
  // Start and end of the track window contributed.
  google.protobuf.Timestamp window_start = 8;
  google.protobuf.Timestamp window_end = 9;
  // Digest of the exact contributed picture artifact
  // ("sha256:<64 lowercase hex>").
  string contribution_digest_sha256 = 10;
  // Stable machine-readable reason code; mandatory on FAILED.
  string transition_reason_code = 11;
  google.protobuf.Timestamp transitioned_at = 12;
}
