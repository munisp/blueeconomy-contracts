syntax = "proto3";

package blueeconomy.contracts.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/munisp/blueeconomy-contracts/gen/go/blueeconomy/contracts/v1;contractsv1";

// EnvelopeClassification is the handling classification asserted by the producer
// for the entire envelope. FIDUCIARY_SEGREGATED marks fiduciary content (for
// example CVFF disbursement flows) that must be stored and replayed in a
// segregated trust boundary; it does not replace the per-event DataClassification
// in common.proto, which governs internal evidence/audit streams. The canonical
// JSON wire form renders these values without the ENVELOPE_CLASSIFICATION_
// prefix (for example ENVELOPE_CLASSIFICATION_CONFIDENTIAL renders as
// "CONFIDENTIAL"); consumers must fail closed on any other value.
enum EnvelopeClassification {
  ENVELOPE_CLASSIFICATION_UNSPECIFIED = 0;
  ENVELOPE_CLASSIFICATION_PUBLIC = 1;
  ENVELOPE_CLASSIFICATION_INTERNAL = 2;
  ENVELOPE_CLASSIFICATION_CONFIDENTIAL = 3;
  ENVELOPE_CLASSIFICATION_RESTRICTED = 4;
  ENVELOPE_CLASSIFICATION_FIDUCIARY_SEGREGATED = 5;
}

// ClearanceLabel is the optional per-record clearance label carried on the
// envelope so classified-scope consumers can persist row-level filtering
// columns. It is distinct from the envelope-level EnvelopeClassification:
// the envelope classification governs the whole event's trust boundary,
// while the clearance label governs individual reader clearance. Mandatory
// for records admitted to classified scopes (for example ISR); the
// UNSPECIFIED zero value means "no per-record label asserted" and classified
// scopes must fail closed on it.
enum ClearanceLabel {
  CLEARANCE_LABEL_UNSPECIFIED = 0;
  CLEARANCE_LABEL_UNCLASSIFIED = 1;
  CLEARANCE_LABEL_RESTRICTED = 2;
  CLEARANCE_LABEL_CONFIDENTIAL = 3;
  CLEARANCE_LABEL_SECRET = 4;
}

// BundleType mirrors the FHIR R4 Bundle.type codes permitted on this platform.
// Fail closed: only MESSAGE is valid for event transport; consumers must reject
// any other value, including UNSPECIFIED. The canonical JSON wire form renders
// the FHIR code "message".
enum BundleType {
  BUNDLE_TYPE_UNSPECIFIED = 0;
  BUNDLE_TYPE_MESSAGE = 1;
}

// BundleEntry is one entry of a FHIR-aligned message Bundle.
message BundleEntry {
  // Stable entry reference (for example "urn:uuid:<uuid>") so entries can
  // reference each other without embedding content.
  string full_url = 1;
  // The domain resource. Modelled as google.protobuf.Any so that the resource
  // type is explicit in the type_url (for example
  // "type.googleapis.com/blueeconomy.contracts.v1.TruckBookingCreated") and
  // consumers can fail closed on unrecognised types. google.protobuf.Struct was
  // rejected: it would discard schema governance and typed code generation for
  // the resources carried on the platform's topics.
  google.protobuf.Any resource = 2;
}

// FhirMessageBundle is the pragmatic, FHIR R4-aligned message Bundle carried by
// every envelope under the canonical "fhir" key. resource_type is fixed to
// "Bundle" and type to BUNDLE_TYPE_MESSAGE; producers must not emit and
// consumers must reject any other combination (fail closed). The first entry is
// the primary event resource for the topic; subsequent entries are supporting
// resources referenced by full_url.
message FhirMessageBundle {
  // Fixed FHIR resourceType discriminator. Must be "Bundle".
  string resource_type = 1;
  // Must be BUNDLE_TYPE_MESSAGE.
  BundleType type = 2;
  // Producer-assigned immutable bundle identifier.
  string bundle_id = 3;
  repeated BundleEntry entry = 4;
}

// EventProvenance binds the envelope to an authenticated principal and to the
// platform ledger without copying credentials or personal data into the event.
message EventProvenance {
  // Keycloak "sub" claim of the authenticated principal (service account or
  // user). Opaque subject identifier; never a username, email or raw token.
  string principal_id = 1;
  // Keycloak realm/client role reference of the principal at emission time.
  string principal_role = 2;
  // Fleet provenance signature: a JWS compact serialization (RFC 7515) using
  // EdDSA over Ed25519, computed over the JCS-canonicalized (RFC 8785) JSON of
  // the full envelope excluding this signature field. The JWS payload segment
  // carries exactly those canonical bytes, so the field is self-verifying.
  // The protected header is exactly {"alg":"EdDSA","kid":"<producer>-<epoch>"}
  // where <producer> is the producing deployable name and <epoch> is the
  // producer's key-rotation epoch. Consumers resolve the signing key from the
  // mounted public-key directory (a JSON object shaped
  // {kid: base64url-ed25519-pubkey}, path from the KEY_DIRECTORY_PATH
  // environment variable), must load it fail-closed at startup, and must
  // reject envelopes with an unknown kid, a malformed compact serialization,
  // a payload that does not byte-match the canonical envelope, or an invalid
  // signature. See docs/envelope-signature.md.
  string signature = 3;
  // Hash of the ledger commit under which this event was anchored. Empty until
  // the commit is recorded; reconciliation uses the AuditCommitRecorded event.
  string ledger_commit_hash = 4;
}

// EventEnvelope is the single integration backbone carried on every platform
// Kafka topic (ports.*, ferries.*, cvff.*). Every domain event is transported
// as the primary resource of the embedded FHIR-aligned message Bundle. The
// canonical JSON wire form uses camelCase keys ("envelopeVersion", "eventId",
// "fhir", "provenance", "classification", ...) exactly as governed by the
// platform event-envelope JSON Schema. Consumers must validate
// envelope_version, type, classification and the provenance signature before
// unpacking entry resources, and must fail closed on any violation.
message EventEnvelope {
  // Version of this envelope contract. The only supported value is "1.0";
  // consumers must reject any other value (fail closed).
  string envelope_version = 1;
  // Globally unique immutable event identifier created by the producer.
  string event_id = 2;
  // Dotted event type, for example "ports.ecallup.truck_booking.created.v1".
  // The value must correspond to the primary resource type in the bundle.
  string event_type = 3;
  google.protobuf.Timestamp occurred_at = 4;
  // Stable name of the producing deployable, not a personal user identifier.
  string producer = 5;
  // Correlation identifier propagated across API, event and workflow boundaries.
  string correlation_id = 6;
  // The FHIR R4-aligned message Bundle. Carried under the canonical "fhir"
  // wire key; the legacy "bundle" key is retired and consumers must reject it.
  FhirMessageBundle fhir = 7;
  EventProvenance provenance = 8;
  EnvelopeClassification classification = 9;
  // Optional per-record clearance label persisted by classified-scope
  // consumers for row-level filtering; mandatory for classified scopes.
  ClearanceLabel record_classification = 10;
}
